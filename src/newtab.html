<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="icon" type="image/png" href="../assets/icons/icon128.png">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-header">
        <a href="https://mail.google.com" class="header-link" title="Gmail">
            <img src="../assets/icons/gmail.png" alt="Gmail" class="header-icon">Gmail
        </a>
        <a href="https://drive.google.com/drive/my-drive" class="header-link" title="Google Drive">
            <img src="../assets/icons/google-drive.png" alt="Google Drive" class="header-icon">Drive
        </a>
        <a href="https://meet.google.com" class="header-link" title="Google Meet">
            <img src="../assets/icons/google-meet.svg" alt="Google Meet" class="header-icon">Meet
        </a>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
            <span class="material-icons">dark_mode</span>
        </button>
    </header>

    <div class="main-container">
        <div class="clock-container">
            <div id="digitalClock" class="clock-text"></div>
            <div id="dateText" class="date-text">Loading...</div>
        </div>

        <div class="search-bar" id="searchBar">
            <div class="search-input-wrapper">
                <span class="material-icons search-icon">search</span>
                <input type="text" id="searchInput" placeholder="Search Google or type a URL" autocomplete="off">
            </div>
            <div class="search-actions">
                <span class="action-icon" id="imageSearchBtn" title="Image Search" style="display: flex; align-items: center; justify-content: center;">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera-icon lucide-camera"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
</span>
                <button id="aiModeBtn" class="ai-mode-btn">
                    <span class="material-icons">auto_awesome</span>
                    <span class="btn-text">AI Mode</span>
                </button>
            </div>
            <ul id="searchSuggestions" class="search-suggestions"></ul>
        </div>

        <div class="shortcuts-slider">
            <div class="shortcuts-wrapper" id="shortcutsWrapper">
                </div>
        </div>
        
        <div class="pagination-dots" id="paginationDots"></div>
    </div>

    <dialog id="addModal">
        <form id="addForm" method="dialog">
            <h3 id="modalHeader">Add Shortcut</h3>
            <div class="input-group">
                <label for="modalUrl">URL</label>
                <input type="url" id="modalUrl" placeholder="https://" required autofocus>
            </div>
            <div class="input-group">
                <label for="modalTitle">Name</label>
                <input type="text" id="modalTitle" placeholder="e.g. YouTube" required>
            </div>
            <div class="modal-actions">
                <button type="button" id="cancelBtn">Cancel</button>
                <button type="submit" class="primary" id="submitBtn">Add</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
